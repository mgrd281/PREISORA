title: Store
description: >-
  A physical location of a RetailerMarket. Always the platform-neutral model - never a
  map-provider object (constitution §9). `distanceMeters` is populated only when the
  request carried a query location.
type: object
required:
  - id
  - retailerMarketId
  - name
  - lat
  - lng
  - address
  - distanceMeters
  - openingHours
properties:
  id:
    type: string
    format: uuid
    description: Permanent canonical store UUID (deep link `https://preisora.de/store/{id}`).
  retailerMarketId:
    type: string
    format: uuid
    description: The RetailerMarket this store belongs to.
  name:
    type: string
    examples:
      - Kaufrausch Berlin-Mitte
  lat:
    type: number
    minimum: -90
    maximum: 90
    description: Latitude in decimal degrees (WGS-84).
  lng:
    type: number
    minimum: -180
    maximum: 180
    description: Longitude in decimal degrees (WGS-84).
  address:
    type: object
    required:
      - street
      - postalCode
      - city
      - countryCode
    properties:
      street:
        type: string
        description: Street and house number.
        examples:
          - Alexanderplatz 3
      postalCode:
        type: string
        examples:
          - '10178'
      city:
        type: string
        examples:
          - Berlin
      countryCode:
        type: string
        pattern: '^[A-Z]{2}$'
  distanceMeters:
    type:
      - integer
      - 'null'
    minimum: 0
    description: >-
      Distance from the query location in integer meters, or `null` when the request
      had no query location.
  openingHours:
    type:
      - array
      - 'null'
    description: >-
      Weekly opening intervals, or `null` when unknown. A day may appear more than once
      (split opening hours).
    items:
      type: object
      required:
        - dayOfWeek
        - opensAt
        - closesAt
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO-8601 day of week (1 = Monday ... 7 = Sunday).
        opensAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local opening time, 24h `HH:MM`.
          examples:
            - '08:00'
        closesAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local closing time, 24h `HH:MM`.
          examples:
            - '20:00'
