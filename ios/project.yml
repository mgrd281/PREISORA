---
# PREISORA iOS — XcodeGen project spec (ADR-0004).
#
# The .xcodeproj is NOT committed; generate it on a Mac:
#   brew install xcodegen && cd ios && xcodegen generate && open Preisora.xcodeproj
#
# Tested shape: XcodeGen 2.x. Deliberately avoids exotic keys to stay version-tolerant.
name: Preisora

options:
  bundleIdPrefix: de.preisora
  developmentLanguage: de
  createIntermediateGroups: true
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Preisora:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Preisora
    settings:
      base:
        PRODUCT_NAME: Preisora
        PRODUCT_BUNDLE_IDENTIFIER: de.preisora.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: PREISORA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
          - en
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Permission strings: the default value is German (development language).
        # Localized variants live in Preisora/Resources/InfoPlist.xcstrings.
        NSCameraUsageDescription: >-
          PREISORA nutzt die Kamera ausschliesslich zum Scannen von Produkt-Barcodes,
          um Preise vergleichen zu koennen.
        NSLocationWhenInUseUsageDescription: >-
          PREISORA nutzt deinen Standort, um Preise und Filialen in deiner Naehe zu
          finden. Ohne Standort zeigen wir eine Berliner Beispielumgebung.
        # Local development against `backend/` over plain HTTP (localhost only).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Custom scheme mirrors docs/deep-links.md so links are testable before
        # universal links / AASA hosting exist (`xcrun simctl openurl booted ...`).
        CFBundleURLTypes:
          - CFBundleURLName: de.preisora.app
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - preisora
    scheme:
      testTargets:
        - PreisoraTests
      gatherCoverageData: false
      environmentVariables:
        PREISORA_API_BASE_URL: http://localhost:3000/api/v1

  PreisoraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PreisoraTests
    dependencies:
      - target: Preisora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.preisora.app.tests
        GENERATE_INFOPLIST_FILE: YES
